name: Ekstrak ZIP Otomatis
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Cek isi repositori
        uses: actions/checkout@v4

      - name: Jalankan Ekstrak Audiobooks
        run: |
          unzip -o -q xx.zip -d ./
          rm xx.zip

      - name: Simpan Folder Baru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sukses paksa ekstrak xx.zip otomatis"
          git push
          
