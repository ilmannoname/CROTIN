name: Ekstrak ZIP Otomatis
on:
  workflow_dispatch: # Mengaktifkan tombol "Run workflow" manual agar tidak error otomatis saat push

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Cek isi repositori
        uses: actions/checkout@v4

      - name: Jalankan Ekstrak Audiobooks
        run: |
          unzip -q xx.zip -d ./
          rm xx.zip

      - name: Simpan Folder Baru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sukses ekstrak Audiobooks.zip otomatis"
          git push
